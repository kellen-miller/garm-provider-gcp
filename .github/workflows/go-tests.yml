name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-packages:
    name: Go / Formatting, static analysis and package tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Golang
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod

      - run: go version

      - name: Run GARM Go Tests
        run: |
            make test
